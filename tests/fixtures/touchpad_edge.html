<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touchpad Edge regression</title>
<style>
  body { margin: 0; background: #eaf0f5; font: 22px sans-serif; min-height: 200vh; }
  main { padding: 50px; }
  pre { font: 18px monospace; white-space: pre-wrap; }
</style>
<main>
  <h1>Touchpad Edge regression</h1>
  <p>Native pinch test. Context menus are recorded without suppressing them.</p>
  <pre id="log"></pre>
</main>
<script>
  const run = new URLSearchParams(location.search).get('run');
  let menus = 0;
  function report() {
    document.title = `TouchpadEdge-${run}|menus=${menus}|scale=${visualViewport.scale.toFixed(4)}`;
    document.getElementById('log').textContent = document.title;
  }
  document.addEventListener('contextmenu', () => { menus++; report(); }, true);
  visualViewport.addEventListener('resize', report);
  report();
</script>
